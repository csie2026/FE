
name: ToPeak FE CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ToPeak FE CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: topeak-fe-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'csie2026/FE'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: topeak-fe-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/topeak-fe-dist

      - name: Deploy frontend to Nginx
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/topeak-fe-dist
        run: |
          set -euo pipefail

          test -f "$ARTIFACT_DIR/index.html"
          test -d "$ARTIFACT_DIR/assets"

          rsync -a --delete \
            "$ARTIFACT_DIR/" \
            /var/www/topeak/

          echo "ToPeak FE deployment completed."
